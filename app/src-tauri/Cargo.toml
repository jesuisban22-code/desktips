[workspace]
members = [
  "core",
  # Not part of the app: it type-checks the shell without a webview.
  "stub/macros", "stub/tauri", "stub/plugin-shell", "stub/plugin-autostart", "stub/shell",
]

[package]
name = "bureau"
version = "0.1.0"
description = "Bureau – watch Claude agents work in 3D"
authors = ["Hs_julyan"]
edition = "2021"

[lib]
name = "bureau_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "bureau"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bureau-core = { path = "core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
